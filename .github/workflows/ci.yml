name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: research/requirements.txt }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - name: Parity fixtures from the Python reference
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy scipy pillow
          python scripts/make_fixtures.py
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: 1 }
      - name: End-to-end (Playwright)
        run: |
          npx playwright install --with-deps chromium
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/ && cp -r drizzle .next/standalone/
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)" API_KEY_PEPPER="$(openssl rand -hex 24)"
          (cd .next/standalone && PORT=3000 NODE_ENV=production node server.js &)
          npx wait-on -t 60000 http://localhost:3000/api/v1/health
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
